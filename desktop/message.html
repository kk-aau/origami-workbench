<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>折纸工坊</title>
  <link rel="stylesheet" href="../src/ui/dialog.css">
  <script src="./message.js" defer></script>
</head>
<body class="ui-dialog-window">
  <section class="ui-dialog" role="alertdialog" aria-modal="true" aria-labelledby="message-title" aria-describedby="message-text message-detail">
    <header class="ui-dialog-header"><h2 id="message-title">确认操作</h2><button type="button" id="message-close" class="ui-dialog-close" aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="ui-dialog-body"><p id="message-text" class="ui-dialog-message"></p><p id="message-detail" class="ui-dialog-detail"></p></div>
    <footer class="ui-dialog-footer"><button type="button" id="message-cancel" class="ui-button">取消</button><button type="button" id="message-accept" class="ui-button is-primary">继续</button></footer>
  </section>
</body>
</html>
