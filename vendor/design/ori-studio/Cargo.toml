# Local adapter manifest: source engines are unmodified; see UPSTREAM.md.
[workspace]
members = ["crates/treemaker-core", "crates/treemaker-fold", "crates/oristudio-bp"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
repository = "https://github.com/zacharyfmarion/ori-studio"
homepage = "https://github.com/zacharyfmarion/ori-studio"

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
needless_late_init = "allow"
drain_collect = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
proptest = "1.6"
treemaker-fold = { path = "crates/treemaker-fold" }
slsqp = "1.0.1"
slsqp-rssl = "0.1.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
