<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>折纸工坊 · 三维模拟</title>
  <link rel="icon" href="data:," />
  <style>:root{color:#37514a;background:#f0f3ef;font-family:Microsoft YaHei UI,Microsoft YaHei,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{touch-action:none;cursor:grab;width:100vw;height:100vh;display:block}canvas:active{cursor:grabbing}#status{white-space:pre-line;pointer-events:none;background:#ffffffed;border:1px solid #dce3db;border-radius:7px;max-width:calc(100% - 36px);padding:8px 12px;font-size:12px;line-height:1.65;position:fixed;top:16px;left:18px}#status.error{color:#a93437;background:#fff1f0;border-color:#e9b6b6}#hint{color:#56675e;pointer-events:none;background:#f0f3efdc;border-radius:4px;max-width:calc(100% - 144px);padding:5px 8px;font-size:12px;position:fixed;bottom:20px;left:128px}#view-actions{flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:calc(100% - 32px);display:flex;position:fixed;top:56px;right:16px}#view-actions button{color:#37514a;cursor:pointer;font:inherit;background:#fff;border:1px solid #ced8cf;border-radius:5px;padding:7px 10px;font-size:12px}#view-actions button:focus-visible{outline-offset:2px;outline:3px solid #2f7660}#view-actions button[aria-pressed=true]{background:#dcece4;border-color:#639680}#view-actions button:disabled{opacity:.5;cursor:default}canvas[data-interaction=grab],canvas[data-interaction=pin]{cursor:crosshair}#pinned-vertices{pointer-events:none}#pinned-vertices i{background:#ffe2af;border:2px solid #9a4914;width:10px;height:10px;position:fixed;transform:translate(-50%,-50%)}#vertex-marker{pointer-events:none;background:#e4fff3c9;border:2px solid #247b68;border-radius:50%;width:13px;height:13px;position:fixed;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #ffffffc7}#vertex-marker[data-state=grab]{background:#ffe6badb;border-color:#b05d1e}#orientation-cube{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;width:104px;height:122px;position:fixed;bottom:16px;left:16px}#orientation-cube:active{cursor:grabbing}#orientation-cube svg{width:104px;height:104px;display:block;overflow:visible}#orientation-cube g{cursor:pointer;outline:none}#orientation-cube polygon{stroke:#f6f8f5;stroke-width:1px;stroke-linejoin:round;transition:fill .12s}#orientation-cube g:hover polygon,#orientation-cube g:focus-visible polygon{fill:#b7d1c0;stroke:#57816d;stroke-width:1.5px}#orientation-cube text{fill:#4e6258;pointer-events:none;font-size:10px}.view-cube-reset{color:#56675e;font:inherit;cursor:pointer;background:#f7f9f4cc;border:0;border-radius:3px;margin:-5px auto 0;padding:3px 11px;font-size:12px;display:block}.view-cube-reset:hover{color:#355a45;background:#dce9dd}.view-cube-reset:focus-visible{outline-offset:2px;outline:2px solid #57816d}body:has(#simulation[data-animation=true]) :is(#status,#hint,#view-actions){display:none}</style>
  <script type="module" crossorigin src="/origami-workbench/assets/simulator-ClJNme5y.js"></script>
  <link rel="modulepreload" crossorigin href="/origami-workbench/assets/simLayerOrder-D4P1sbqJ.js">
  <link rel="modulepreload" crossorigin href="/origami-workbench/assets/simStepAnimation-B2-9lIBI.js">
</head>
<body>
  <canvas id="simulation" aria-label="折纸三维模拟。拖动旋转视角，滚轮缩放。按住 Shift 或开启顶点塑形后拖动顶点调整纸面。"></canvas>
  <div id="vertex-marker" hidden aria-hidden="true"></div>
  <div id="pinned-vertices" aria-hidden="true"></div>
  <div id="status" role="status" aria-live="polite">正在加载本地模拟引擎…</div>
  <div id="hint">拖动旋转 · 滚轮缩放 · Shift+拖动顶点塑形</div>
  <div id="orientation-cube"></div>
  <div id="view-actions"><button id="vertex-grab" type="button" aria-pressed="false">顶点塑形</button><button id="vertex-pin" type="button" aria-pressed="false" title="点击顶点固定，再次点击解除">固定点</button><button id="pins-clear" type="button" disabled>解除全部</button><button id="pose-undo" type="button" title="撤销三维操作（Ctrl+Z）" disabled>撤销</button><button id="pose-redo" type="button" title="重做三维操作（Ctrl+Shift+Z）" disabled>重做</button><button id="view-reset" type="button">视角复位</button></div>
</body>
</html>
